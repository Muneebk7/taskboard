<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskBoard</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#1d2433;background:#f6f7f9}
h1{margin-bottom:.2rem} .card{background:#fff;border:1px solid #dde1e7;border-radius:8px;padding:1rem;margin:1rem 0}
input,select,button{font:inherit;padding:.45rem .6rem;margin:.2rem .2rem .2rem 0;border:1px solid #b9c0cc;border-radius:6px}
button{background:#1f5eff;color:#fff;border-color:#1f5eff;cursor:pointer} button.alt{background:#fff;color:#1d2433;border-color:#b9c0cc}
button.del{background:#fff;color:#b3261e;border-color:#e3b5b2} li{padding:.35rem 0;list-style:none;border-bottom:1px solid #eef0f3}
ul{padding:0} .done{text-decoration:line-through;color:#7a8394} #msg{color:#b3261e;min-height:1.2rem}
</style></head><body>
<h1>TaskBoard</h1><p>Plan your projects and track tasks.</p><div id="msg"></div>

<div id="authBox" class="card">
  <h3>Create an account or log in</h3>
  <input id="name" placeholder="Name (sign up only)"> <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <div><button onclick="auth('register')">Sign up</button><button class="alt" onclick="auth('login')">Log in</button></div>
</div>

<div id="app" hidden>
  <p>Signed in as <b id="who"></b> <button class="alt" onclick="logout()">Log out</button></p>
  <div class="card"><h3>Projects</h3>
    <input id="pname" placeholder="Project name"> <input id="pdesc" placeholder="Description (optional)">
    <button onclick="addProject()">Add project</button><ul id="projects"></ul></div>
  <div class="card"><h3>Tasks</h3>
    <select id="tproject" onchange="loadTasks()"></select>
    <input id="ttitle" placeholder="New task"> <input id="tdue" type="date">
    <button onclick="addTask()">Add task</button>
    <select id="tfilter" onchange="loadTasks()"><option value="">All</option><option>todo</option><option>doing</option><option>done</option></select>
    <ul id="tasks"></ul></div>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) { $('msg').textContent = data.error || 'Something went wrong'; throw new Error(data.error); }
  $('msg').textContent = ''; return data;
}
async function auth(kind) {
  const u = await api('POST', '/api/' + kind, { name: $('name').value, email: $('email').value, password: $('password').value });
  start(u);
}
function start(u) { $('authBox').hidden = true; $('app').hidden = false; $('who').textContent = u.name; loadProjects(); }
async function logout() { await api('POST', '/api/logout'); location.reload(); }
async function loadProjects() {
  const ps = await api('GET', '/api/projects');
  $('projects').innerHTML = ps.map(p => `<li><b>${esc(p.name)}</b> (${p.task_count} tasks) ${esc(p.description || '')}
    <button class="del" onclick="delProject(${p.id})">Delete</button></li>`).join('') || '<li>No projects yet. Add your first one above.</li>';
  $('tproject').innerHTML = ps.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  loadTasks();
}
async function addProject() { await api('POST', '/api/projects', { name: $('pname').value, description: $('pdesc').value }); $('pname').value = $('pdesc').value = ''; loadProjects(); }
async function delProject(id) { await api('DELETE', '/api/projects/' + id); loadProjects(); }
async function loadTasks() {
  const pid = $('tproject').value; if (!pid) { $('tasks').innerHTML = ''; return; }
  const ts = await api('GET', `/api/tasks?project_id=${pid}&status=${$('tfilter').value}`);
  $('tasks').innerHTML = ts.map(t => `<li class="${t.status}"><span class="${t.status === 'done' ? 'done' : ''}">${esc(t.title)}</span>
    <select onchange="setStatus(${t.id}, this.value)">${['todo','doing','done'].map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <button class="del" onclick="delTask(${t.id})">Delete</button></li>`).join('') || '<li>No tasks here yet.</li>';
}
async function addTask() { await api('POST', '/api/tasks', { project_id: $('tproject').value, title: $('ttitle').value, due_date: $('tdue').value }); $('ttitle').value = ''; loadProjects(); }
async function setStatus(id, status) { await api('PUT', '/api/tasks/' + id, { status }); loadTasks(); }
async function delTask(id) { await api('DELETE', '/api/tasks/' + id); loadProjects(); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/me').then(r => r.ok ? r.json() : null).then(u => u && start(u));
</script></body></html>
